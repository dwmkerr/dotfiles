# kitty, kept visually in step with the iTerm2 profiles. Colours and font
# come from terminal/iTerm2/base.json; change them there first, then here.
# kitty is here for the Kitty graphics protocol, which shows pictures in
# terminal programs, including over SSH.

font_family Monaco
font_size 12.0

# One Dark (dwmkerr variant).
foreground #abb2bf
background #21252b
cursor #abb2bf
selection_foreground #abb2bf
selection_background #323844
color0 #21252b
color1 #e06c75
color2 #98c379
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #abb2bf
color8 #767676
color9 #e06c75
color10 #98c379
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #d7dae1

background_opacity 0.92

# Left option sends Esc+ as in iTerm, right option stays for accents.
macos_option_as_alt left
